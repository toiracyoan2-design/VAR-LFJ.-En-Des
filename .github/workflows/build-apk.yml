name: Compilar APK VAR-LFJ

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Descargar proyecto
uses: actions/checkout@v4

  - name: Preparar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Preparar Android
    uses: android-actions/setup-android@v3

  - name: Compilar proyecto HTML
    run: |
      sudo apt-get update
      sudo apt-get install -y npm
      npm install -g @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6
      mkdir -p www
      cp index.html www/index.html
      npm init -y
      npx cap init VAR-LFJ com.varlfj.app --web-dir www
      npx cap add android
      npx cap sync android
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Guardar APK
    uses: actions/upload-artifact@v4
    with:
      name: VAR-LFJ-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk